name: Bug report
description: Report incorrect or unexpected behaviour
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please include enough information to reproduce it.

  - type: input
    id: version
    attributes:
      label: hatch-versiondetail version
      description: Release tag, commit hash, or Git dependency reference.
      placeholder: v0.2.0
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: Python 3.13.7
    validations:
      required: true

  - type: input
    id: hatch-version
    attributes:
      label: Hatch or Hatchling version
      placeholder: Hatchling 1.32.4
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, or macOS 15
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Include the relevant sections of your pyproject.toml.
      render: toml
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest example and commands that reproduce the problem.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Full error output
      description: Remove tokens, credentials, and other sensitive information.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and private information from the report.
          required: true