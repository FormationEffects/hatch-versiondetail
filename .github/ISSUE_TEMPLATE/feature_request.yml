name: Feature request
description: Suggest an improvement or new versioning capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. A proposed implementation is optional.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or use case should this feature address?
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: Proposed behaviour
      description: What should hatch-versiondetail do?
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Example configuration
      description: Show how the feature might be configured in pyproject.toml.
      render: toml

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any current workarounds or alternative solutions.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request relates to hatch-versiondetail rather than Hatch itself.
          required: true